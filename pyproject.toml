[project]
name = "meet"
version = "0.1.0"
description = "Local meeting capture, zh/en transcription with diarization, and vault summarisation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.2",
    "qwen3-asr-mlx==0.2.0",
    "sherpa-onnx==1.13.5",
    "sherpa-onnx-core==1.13.5",
]

[project.scripts]
meet = "meet.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "ty==0.0.72",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored upstream sample code and downloaded models are not ours to lint.
extend-exclude = ["models", "vendor", "recordings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "N", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.rules]
possibly-missing-attribute = "error"
invalid-return-type = "error"

[tool.ty.src]
exclude = ["models", "vendor", "recordings"]
